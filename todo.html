<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>To-Do | Ankur Singh</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --bg: #07070a;
      --card: rgba(255, 255, 255, 0.045);
      --border: rgba(255, 255, 255, 0.10);
      --text: #f7f7fb;
      --muted: #a1a1aa;
      --primary: #8b5cf6;
      --secondary: #06b6d4;
      --gradient: linear-gradient(135deg, #8b5cf6, #06b6d4);
      --danger: #f87171;
      --success: #34d399;
      --radius: 22px;
      --max-width: 760px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Inter", sans-serif;
      background:
        radial-gradient(circle at 10% 10%, rgba(139, 92, 246, 0.13), transparent 30%),
        radial-gradient(circle at 90% 20%, rgba(6, 182, 212, 0.10), transparent 30%),
        var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    a { color: inherit; text-decoration: none; }

    .container { width: min(92%, var(--max-width)); margin: auto; }

    /* ================= HEADER ================= */

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(7, 7, 10, 0.72);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .nav { height: 72px; display: flex; align-items: center; justify-content: space-between; }

    .logo { font-family: "Space Grotesk", sans-serif; font-size: 1.45rem; font-weight: 700; letter-spacing: -1px; }
    .logo span { color: #a78bfa; }

    .back { color: #b8b8c2; font-size: .92rem; transition: .3s ease; }
    .back:hover { color: white; }

    /* ================= PAGE ================= */

    main { padding: 56px 0 80px; }

    .eyebrow { color: #a78bfa; font-size: .85rem; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; }

    h1 {
      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(2.2rem, 6vw, 3.2rem);
      letter-spacing: -2px;
      line-height: 1.1;
      margin: 8px 0 10px;
    }

    .gradient-text { background: var(--gradient); -webkit-background-clip: text; background-clip: text; color: transparent; }

    .lead { color: var(--muted); margin-bottom: 32px; }
    .lead code { color: #67e8f9; font-size: .9em; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 26px;
      margin-bottom: 22px;
    }

    .card h2 { font-family: "Space Grotesk", sans-serif; font-size: 1.2rem; margin-bottom: 16px; display: flex; gap: 8px; align-items: center; }
    .count { color: var(--muted); font-weight: 500; font-size: .95rem; }

    /* ================= FORM ================= */

    form { display: grid; gap: 12px; }

    label { font-size: .85rem; color: var(--muted); display: grid; gap: 6px; }

    input[type="text"], textarea {
      width: 100%;
      padding: 12px 14px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--text);
      font: inherit;
      transition: border-color .2s ease;
    }
    textarea { resize: vertical; min-height: 80px; }
    input::placeholder, textarea::placeholder { color: #71717a; }
    input:focus, textarea:focus { outline: none; border-color: var(--primary); }

    .btn {
      font: inherit;
      font-weight: 600;
      font-size: .88rem;
      padding: 10px 18px;
      border-radius: 100px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      cursor: pointer;
      transition: .25s ease;
    }
    .btn:hover { background: rgba(255,255,255,0.06); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-primary { background: var(--gradient); border: none; color: white; justify-self: start; }
    .btn-primary:hover { background: var(--gradient); transform: translateY(-2px); box-shadow: 0 10px 30px rgba(139, 92, 246, 0.25); }
    .btn-small { padding: 6px 14px; font-size: .8rem; }
    .btn-danger { color: var(--danger); }
    .btn-danger:hover { background: rgba(248, 113, 113, 0.1); }

    .status { min-height: 1.5em; font-size: .88rem; }
    .status.error { color: var(--danger); }
    .status.ok { color: var(--success); }

    /* ================= TASK LIST ================= */

    .filters { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
    .filters .btn.active { background: rgba(139, 92, 246, 0.18); border-color: var(--primary); }

    .task {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      padding: 16px 0;
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    .task:first-child { border-top: none; }

    .task input[type="checkbox"] { margin-top: 5px; width: 18px; height: 18px; accent-color: var(--primary); cursor: pointer; flex-shrink: 0; }
    .task .body { flex: 1; min-width: 0; }
    .task h3 { font-size: 1rem; font-weight: 600; word-break: break-word; }
    .task.done h3 { text-decoration: line-through; color: #71717a; }
    .task p { color: var(--muted); font-size: .92rem; word-break: break-word; }
    .task .meta { color: #71717a; font-size: .78rem; margin-top: 2px; }
    .task .actions { display: flex; gap: 6px; flex-shrink: 0; }
    .task .edit-form { gap: 8px; }
    .task .edit-form .row { display: flex; gap: 6px; }

    .empty { color: var(--muted); text-align: center; padding: 20px 0; }

    .api-info { font-size: .82rem; color: #71717a; text-align: center; word-break: break-all; }
    .api-info code { color: #a1a1aa; }

    @media (max-width: 560px) {
      .card { padding: 20px; }
      .task { flex-wrap: wrap; }
      .task .actions { width: 100%; padding-left: 32px; }
    }
  </style>
</head>

<body>

  <header>
    <div class="container nav">
      <a href="my_website.html" class="logo">Ankur<span>.</span></a>
      <a href="my_website.html" class="back">← Back to Portfolio</a>
    </div>
  </header>

  <main class="container">

    <div class="eyebrow">Frontend + REST API</div>
    <h1>My <span class="gradient-text">To-Do</span> List</h1>
    <p class="lead">
      Ye page static hai (Nginx serve karta hai). Data Django REST API se aata hai:
      <code id="api-url"></code>
    </p>

    <!-- ===== CREATE ===== -->
    <section class="card">
      <h2>➕ Add Task</h2>
      <form id="create-form">
        <label>
          Title *
          <input type="text" id="title" placeholder="e.g. Docker seekhna" maxlength="200" required />
        </label>
        <label>
          Description
          <textarea id="description" placeholder="Optional details..."></textarea>
        </label>
        <button type="submit" class="btn btn-primary" id="add-btn">Add Task</button>
        <div id="status" class="status"></div>
      </form>
    </section>

    <!-- ===== READ / UPDATE / DELETE ===== -->
    <section class="card">
      <h2>📋 Tasks <span class="count" id="count"></span></h2>
      <div class="filters">
        <button type="button" class="btn btn-small active" data-filter="all">All</button>
        <button type="button" class="btn btn-small" data-filter="pending">Pending</button>
        <button type="button" class="btn btn-small" data-filter="done">Done</button>
      </div>
      <div id="task-list"><div class="empty">Loading...</div></div>
    </section>

    <p class="api-info">Backend: <code id="api-url-footer"></code></p>

  </main>

  <script>
    // ================= CONFIG =================
    // Local par (localhost) apna local Django use karo, warna live server.
    const IS_LOCAL = ["localhost", "127.0.0.1", ""].includes(window.location.hostname);
    const API_BASE = IS_LOCAL
      ? "http://127.0.0.1:8000/api/tasks/"
      : "https://gpslive.online/api/tasks/";

    document.getElementById("api-url").textContent = API_BASE;
    document.getElementById("api-url-footer").textContent = API_BASE;

    const listEl = document.getElementById("task-list");
    const countEl = document.getElementById("count");
    const statusEl = document.getElementById("status");
    let allTasks = [];
    let currentFilter = "all";

    // ================= HELPERS =================

    function showStatus(message, type) {
      statusEl.textContent = message;
      statusEl.className = "status " + (type || "");
      if (type === "ok") setTimeout(() => { statusEl.textContent = ""; }, 2500);
    }

    // Har API call yahin se jaati hai
    async function api(url, method, body) {
      const options = { method: method || "GET", headers: {} };
      if (body !== undefined) {
        options.headers["Content-Type"] = "application/json";
        options.body = JSON.stringify(body);
      }
      let response;
      try {
        response = await fetch(url, options);
      } catch (err) {
        // Network fail / CORS block — browser asli wajah console (F12) me dikhata hai
        throw new Error("API se connect nahi ho paya (server band hai ya CORS block). F12 → Console dekho.");
      }
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || "Request fail (" + response.status + ")");
      return data;
    }

    // Element banane ka helper (textContent = user ka text kabhi HTML nahi banega)
    function el(tag, props, children) {
      const node = document.createElement(tag);
      Object.assign(node, props || {});
      (children || []).forEach((child) => node.append(child));
      return node;
    }

    // ================= RENDER =================

    function render() {
      const tasks = allTasks.filter((task) =>
        currentFilter === "all" ? true : currentFilter === "done" ? task.done : !task.done
      );
      const doneCount = allTasks.filter((task) => task.done).length;
      countEl.textContent = "(" + doneCount + "/" + allTasks.length + " done)";

      listEl.replaceChildren();
      if (tasks.length === 0) {
        listEl.append(el("div", { className: "empty", textContent: allTasks.length ? "Is filter me koi task nahi." : "Abhi koi task nahi — upar se add karo 👆" }));
        return;
      }
      tasks.forEach((task) => listEl.append(renderTask(task)));
    }

    function renderTask(task) {
      const row = el("div", { className: "task" + (task.done ? " done" : "") });

      const checkbox = el("input", { type: "checkbox", checked: task.done, title: "Done mark karo" });
      checkbox.addEventListener("change", () => updateTask(task.id, { done: checkbox.checked }));

      const body = el("div", { className: "body" }, [
        el("h3", { textContent: task.title }),
        ...(task.description ? [el("p", { textContent: task.description })] : []),
        el("div", { className: "meta", textContent: "#" + task.id + " · " + new Date(task.created_at).toLocaleString() }),
      ]);

      const editBtn = el("button", { type: "button", className: "btn btn-small", textContent: "Edit" });
      const deleteBtn = el("button", { type: "button", className: "btn btn-small btn-danger", textContent: "Delete" });
      const actions = el("div", { className: "actions" }, [editBtn, deleteBtn]);

      editBtn.addEventListener("click", () => showEditForm(body, actions, task));
      deleteBtn.addEventListener("click", () => deleteTask(task));

      row.append(checkbox, body, actions);
      return row;
    }

    function showEditForm(body, actions, task) {
      const titleInput = el("input", { type: "text", value: task.title, maxLength: 200, required: true });
      const descInput = el("textarea", { value: task.description });
      const saveBtn = el("button", { type: "submit", className: "btn btn-small btn-primary", textContent: "Save" });
      const cancelBtn = el("button", { type: "button", className: "btn btn-small", textContent: "Cancel" });

      const form = el("form", { className: "edit-form" }, [
        titleInput, descInput, el("div", { className: "row" }, [saveBtn, cancelBtn]),
      ]);
      form.addEventListener("submit", (event) => {
        event.preventDefault();
        updateTask(task.id, { title: titleInput.value, description: descInput.value });
      });
      cancelBtn.addEventListener("click", render);

      body.replaceWith(el("div", { className: "body" }, [form]));
      actions.remove();
      titleInput.focus();
    }

    // ================= CRUD =================

    // READ
    async function loadTasks() {
      try {
        const data = await api(API_BASE);
        allTasks = data.results;
        render();
      } catch (err) {
        listEl.replaceChildren(el("div", { className: "empty", textContent: "⚠️ " + err.message }));
      }
    }

    // CREATE
    document.getElementById("create-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const titleEl = document.getElementById("title");
      const descEl = document.getElementById("description");
      const addBtn = document.getElementById("add-btn");
      addBtn.disabled = true;
      try {
        await api(API_BASE, "POST", { title: titleEl.value, description: descEl.value });
        titleEl.value = "";
        descEl.value = "";
        showStatus("✅ Task add ho gaya", "ok");
        await loadTasks();
      } catch (err) {
        showStatus("⚠️ " + err.message, "error");
      } finally {
        addBtn.disabled = false;
      }
    });

    // UPDATE
    async function updateTask(id, changes) {
      try {
        await api(API_BASE + id + "/", "PUT", changes);
        showStatus("✅ Task update ho gaya", "ok");
      } catch (err) {
        showStatus("⚠️ " + err.message, "error");
      }
      loadTasks();
    }

    // DELETE
    async function deleteTask(task) {
      if (!confirm('"' + task.title + '" delete karna hai?')) return;
      try {
        await api(API_BASE + task.id + "/", "DELETE");
        showStatus("🗑️ Task delete ho gaya", "ok");
      } catch (err) {
        showStatus("⚠️ " + err.message, "error");
      }
      loadTasks();
    }

    // ================= FILTERS =================
    document.querySelectorAll("[data-filter]").forEach((button) => {
      button.addEventListener("click", () => {
        currentFilter = button.dataset.filter;
        document.querySelectorAll("[data-filter]").forEach((b) => b.classList.toggle("active", b === button));
        render();
      });
    });

    loadTasks();
  </script>

</body>
</html>
